[project]
name = "tether"
version = "0.1.0"
description = "Run AI coding harnesses in a disposable Docker container."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "tether contributors" }]
dependencies = ["click>=8.1"]

[project.scripts]
tether = "tether.cli:main"

[dependency-groups]
dev = ["ruff>=0.6", "ty>=0.0.1a1", "pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tether"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
