[project]
name = "tether"
version = "0.3.0"
description = "Run AI coding harnesses in a disposable Docker container."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
authors = [{ name = "tether contributors" }]
dependencies = [
    "click>=8.5",
    "platformdirs>=4",
    "rich>=13",
]

[project.urls]
Homepage = "https://8cylinder.github.io/tether/"
Repository = "https://github.com/8cylinder/tether"
Issues = "https://github.com/8cylinder/tether/issues"

[project.scripts]
tether = "tether.cli:main"

[dependency-groups]
dev = [
    "furo",
    "myst-parser",
    "pytest>=8.0",
    "pytest-cov>=6",
    "ruff>=0.6",
    "sphinx>=9",
    "sphinx-autobuild",
    "sphinx-click>=6",
    "ty>=0.0.1a1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tether"]

[tool.ruff]
line-length = 80
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
extend-select = ["ANN", "PGH003", "PYI"]

[tool.ty.rules]
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-return-statement = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --cov=tether --cov-branch --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["tether"]

[tool.coverage.report]
fail_under = 90
show_missing = true
